name: Auto Update Schedule

on:
  schedule:
    - cron: '0 */4 * * *' # Автозапуск каждые 4 часа
  workflow_dispatch:      # Позволяет запускать кнопкой с телефона

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install libraries
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run scraper
        env:
          PORTAL_LOGIN: ${{ secrets.PORTAL_LOGIN }}
          PORTAL_PASSWORD: ${{ secrets.PORTAL_PASSWORD }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python main.py

      - name: Update schedule.ics in repo
        run: |
          git config user.name "Schedule Bot"
          git config user.email "bot@github.com"
          git add schedule.ics
          git diff --staged --quiet || git commit -m "Auto-update schedule"
          git push
